<div style="width: 90px">
  @if (!show) {
    <button class="btn btn-warning btn-sm" (click)="display()">
      Show <fa-icon [icon]="clockIcon"></fa-icon>
    </button>
  }
</div>

@if (show) {
  <span style="color: darkgrey;">
    <app-copy-to-clipboard [content]="content"></app-copy-to-clipboard>
  </span>
}
